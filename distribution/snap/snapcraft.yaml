# NOTE:
# Since the snap info has been manually edited on the snap store
# this file will only be used in development
# and metadata will be ignored

name: agent-one
base: core22
version: "1.0.1"
summary: Free AI agent and deep researcher
description: |
  AgentOne is a powerful AI agent that gives you freedom to choose your
  models and control your data.
grade: stable
confinement: strict

layout:
  /usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$SNAPCRAFT_ARCH_TRIPLET/webkit2gtk-4.1

apps:
  agent-one:
    command: usr/bin/agent-one
    desktop: usr/share/applications/AgentOne.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - audio-playback
      - single-instance-plug

slots:
  single-instance:
    interface: dbus
    bus: session
    name: org.dev_agent_one.SingleInstance

plugs:
  single-instance-plug:
    interface: dbus
    bus: session
    name: org.dev_agent_one.SingleInstance

package-repositories:
  - type: apt
    components: [main]
    suites: [noble]
    key-id: 78E1918602959B9C59103100F1831DDAFC42E99D
    url: http://ppa.launchpad.net/snappy-dev/snapcraft-daily/ubuntu

parts:
  agent-one:
    plugin: dump
    source: .
    override-build: |
      set -eu
      # Find the .deb - CI places it in the source root, local builds put it under src-tauri/target
      DEB_FILE=$(find . -name '*.deb' -print -quit)
      if [ -z "$DEB_FILE" ]; then
        echo "ERROR: No .deb file found" >&2
        exit 1
      fi
      dpkg -x "$DEB_FILE" $SNAPCRAFT_PART_INSTALL/
      # Fix desktop file icon path for snap
      sed -i -e "s|Icon=agent-one|Icon=/usr/share/icons/hicolor/32x32/apps/agent-one.png|g" \
        $SNAPCRAFT_PART_INSTALL/usr/share/applications/AgentOne.desktop 2>/dev/null || true
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
