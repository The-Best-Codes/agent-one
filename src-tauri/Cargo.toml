[package]
name = "agent-one"
version = "1.0.4"
description = "AgentOne is a powerful AI agent that gives you freedom to choose your models and control your data."
authors = ["The-Best-Codes"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
rand = "0.10.2"
htmd = "0.5.5"
once_cell = "1.21.4"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
wreq = { version = "5.3.0", features = ["json", "gzip", "brotli", "deflate", "cookies"] }
wreq-util = "2.2.6"
urlencoding = "2.1.3"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
keyring-core = "1.0.0"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
axum = "0.8.9"
url = "2.5.8"
rmcp = { version = "3.1.2", features = [
  "auth",
  "client",
  "transport-streamable-http-client",
  "transport-streamable-http-client-reqwest",
] }
async-trait = "0.1.92"
tauri-plugin-websocket = "2"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls"] }
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_Packaging_Appx",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
