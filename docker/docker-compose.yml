services:
  agent-one-playwright-test-runner:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: agent-one-playwright-test-runner
    ipc: host
    init: true
    command: tail -f /dev/null
    volumes:
      # Essential Application Source & Configuration
      - ../src:/app/src
      - ../tests:/app/tests
      - ../public:/app/public
      - ../index.html:/app/index.html
      - ../vite.config.ts:/app/vite.config.ts
      - ../playwright.config.ts:/app/playwright.config.ts
      - ../tsconfig.json:/app/tsconfig.json
      - ../tsconfig.node.json:/app/tsconfig.node.json
      - ../components.json:/app/components.json
      - ../eslint.config.js:/app/eslint.config.js
      # Mount these seperately
      - ../docker-report/playwright-report:/app/playwright-report
      - ../docker-report/test-results:/app/test-results
