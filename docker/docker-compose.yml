services:
  agent-one-playwright-test-runner:
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    container_name: agent-one-playwright-test-runner
    ipc: host
    init: true
    command: tail -f /dev/null
    volumes:
      # Mount these seperately
      - ../docker-report/playwright-report:/app/playwright-report
      - ../docker-report/test-results:/app/test-results
