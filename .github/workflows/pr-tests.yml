name: PR Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deps-key: ${{ steps.hash.outputs.key }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"

      - name: Generate dependency key
        id: hash
        run: echo "key=${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.hash.outputs.key }}

      - name: Install JS dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Build Project
        run: npm run build

      - name: Upload dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: deps-${{ steps.hash.outputs.key }}
          path: |
            node_modules
            ~/.cache/ms-playwright
          retention-days: 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 1

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: deps-${{ needs.setup.outputs.deps-key }}
          path: |
            .
            ~/.cache/

      - name: Run Linting
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: deps-${{ needs.setup.outputs.deps-key }}
          path: |
            .
            ~/.cache/

      - name: Run Type Checking
        run: npm run typecheck

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tauri Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Run Rust Cargo Check
        run: cd src-tauri && cargo check

  e2e:
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies for Playwright
        run: npx playwright install --with-deps

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: deps-${{ needs.setup.outputs.deps-key }}
          path: |
            .
            ~/.cache/

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Run E2E Playwright Tests (Shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          CI: true

      - name: Upload Playwright report for shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-shard-*
          path: playwright-reports/
          merge-multiple: true

      - name: Upload combined Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-combined
          path: playwright-reports/
          retention-days: 1
