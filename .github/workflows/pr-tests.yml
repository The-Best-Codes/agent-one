name: PR Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: tenki-standard-autoscale
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        test: [typecheck, lint, e2e, rust-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "23"
          cache: "npm"
        if: matrix.test == 'typecheck' || matrix.test == 'lint' || matrix.test == 'e2e'

      - name: Install JS dependencies
        run: npm ci
        if: matrix.test == 'typecheck' || matrix.test == 'lint' || matrix.test == 'e2e'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: matrix.test == 'e2e'

      - name: Install Tauri Linux System Dependencies
        run: |
          # Update package lists
          sudo apt update
          # Install required Tauri system dependencies for Ubuntu/Debian
          sudo apt install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
        if: matrix.test == 'rust-check'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
        if: matrix.test == 'rust-check'

      - name: Run Type Checking
        run: npm run typecheck
        if: matrix.test == 'typecheck'

      - name: Run Linting
        run: npm run lint
        if: matrix.test == 'lint'

      - name: Build Project for E2E
        run: npm run build
        if: matrix.test == 'e2e'

      - name: Run E2E Playwright Tests
        run: npm run test-local:e2e
        env:
          CI: true
        if: matrix.test == 'e2e'

      - name: Run Rust Cargo Check
        run: cd src-tauri && cargo check
        if: matrix.test == 'rust-check'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'e2e'
        with:
          name: playwright-report-${{ matrix.test }}
          path: playwright-report/
          retention-days: 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'e2e'
        with:
          name: test-results-${{ matrix.test }}
          path: test-results/
          retention-days: 1
