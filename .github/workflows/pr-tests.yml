name: PR Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: tenki-standard-autoscale
    container:
      image: ghcr.io/the-best-codes/agent-one-base-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        test: [typecheck, lint, format-check, e2e, rust-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JS dependencies
        run: npm ci --prefer-offline --no-audit
        if: matrix.test == 'typecheck' || matrix.test == 'lint' || matrix.test == 'format-check' || matrix.test == 'e2e'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
        if: matrix.test == 'rust-check'

      - name: Run Type Checking
        run: npm run typecheck
        if: matrix.test == 'typecheck'

      - name: Run Linting
        run: npm run lint
        if: matrix.test == 'lint'

      - name: Run Format Check
        run: npm run format:check
        if: matrix.test == 'format-check'

      - name: Build Project for E2E
        run: npm run build
        if: matrix.test == 'e2e'

      - name: Run E2E Playwright Tests
        run: npm run test-local:e2e
        env:
          CI: true
        if: matrix.test == 'e2e'

      - name: Run Rust Cargo Check
        run: cd src-tauri && cargo check
        if: matrix.test == 'rust-check'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'e2e'
        with:
          name: playwright-report-${{ matrix.test }}
          path: playwright-report/
          retention-days: 1

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always() && matrix.test == 'e2e'
        with:
          name: test-results-${{ matrix.test }}
          path: test-results/
          retention-days: 1
