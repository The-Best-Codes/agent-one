name: Publish to AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. agent-one-v0.0.0)"
        required: true
        type: string

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify .deb asset exists in release
        id: deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"

          # Get the list of assets for this release
          ASSETS=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets[].name')
          echo "Assets in release $TAG:"
          echo "$ASSETS"

          # Find the amd64 .deb asset
          DEB_ASSET=$(echo "$ASSETS" | grep '_amd64\.deb$' | grep -v '\.sig$' | head -n1)
          if [ -z "$DEB_ASSET" ]; then
            echo "ERROR: No amd64 .deb asset found in release $TAG. Aborting."
            exit 1
          fi
          echo "Found deb: $DEB_ASSET"
          echo "deb_name=$DEB_ASSET" >> "$GITHUB_OUTPUT"

          # Extract version from tag (strips leading 'agent-one-v')
          VERSION="${TAG#agent-one-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download .deb and compute SHA256
        id: checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          DEB="${{ steps.deb.outputs.deb_name }}"

          gh release download "$TAG" \
            --repo ${{ github.repository }} \
            --pattern "$DEB" \
            --dir /tmp/deb

          SHA256=$(sha256sum "/tmp/deb/$DEB" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "SHA256 of $DEB: $SHA256"

      - name: Render PKGBUILD
        run: |
          VERSION="${{ steps.deb.outputs.version }}"
          SHA256="${{ steps.checksum.outputs.sha256 }}"

          mkdir -p /tmp/aur
          cp "distribution/aur/agent-one-bin.install" /tmp/aur/agent-one-bin.install

          sed \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/sha256sums_x86_64=('SKIP')/sha256sums_x86_64=('${SHA256}')/" \
            distribution/aur/PKGBUILD > /tmp/aur/PKGBUILD

          echo "Rendered PKGBUILD:"
          cat /tmp/aur/PKGBUILD

      - name: Generate .SRCINFO via Arch Linux container
        run: |
          # makepkg must run as a non-root user; we create one inside the container
          docker run --rm \
            -v /tmp/aur:/pkg \
            -w /pkg \
            archlinux:base \
            bash -c "
              pacman -Sy --noconfirm --needed base-devel 2>&1 | tail -3
              useradd -m builder
              chown -R builder:builder /pkg
              su builder -c 'cd /pkg && makepkg --printsrcinfo > .SRCINFO'
            "

          echo ".SRCINFO contents:"
          cat /tmp/aur/.SRCINFO

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa aur.archlinux.org >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone AUR repo and push update
        run: |
          VERSION="${{ steps.deb.outputs.version }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone ssh://aur@aur.archlinux.org/agent-one-bin.git /tmp/aur-repo

          cp /tmp/aur/PKGBUILD /tmp/aur-repo/PKGBUILD
          cp /tmp/aur/agent-one-bin.install /tmp/aur-repo/agent-one-bin.install
          cp /tmp/aur/.SRCINFO /tmp/aur-repo/.SRCINFO

          cd /tmp/aur-repo
          git add PKGBUILD agent-one-bin.install .SRCINFO
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No changes to commit. AUR is already up to date."
          else
            git commit -m "Update to v${VERSION}"
            git push
            echo "Successfully published agent-one-bin v${VERSION} to AUR."
          fi
