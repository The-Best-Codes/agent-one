name: "release"

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      snap-only:
        description: "Skip full build and only rebuild the snap (requires a previous deb artifact or release .deb)"
        required: false
        type: boolean
        default: false
      msix-only:
        description: "Skip full build and only build the MSIX bundle (requires a previous release)"
        required: false
        type: boolean
        default: false

jobs:
  create-release:
    if: ${{ !inputs.snap-only }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(head -n1 .version | tr -d '[:space:]')
          TAG="agent-one-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "AgentOne v${VERSION}" \
              --notes "See the assets below this release to download and install this version."
          fi

  generate-matrix:
    if: ${{ !inputs.snap-only }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build build matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.msix-only }}" == "true" ]; then
            echo 'matrix={"include":[{"platform":"windows-latest","args":""}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin"},{"platform":"ubuntu-22.04","args":""},{"platform":"windows-latest","args":""}]}' >> "$GITHUB_OUTPUT"
          fi

  release-tauri:
    needs: [create-release, generate-matrix]
    if: ${{ !inputs.snap-only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "src-tauri -> target"

      - name: Cache and install Tauri system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.1
        if: matrix.platform == 'ubuntu-22.04'

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: agent-one-v__VERSION__
          releaseName: "AgentOne v__VERSION__"
          releaseBody: "See the assets below this release to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Install aarch64 Rust target for MSIX
        if: matrix.platform == 'windows-latest'
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build MSIX bundle
        if: matrix.platform == 'windows-latest'
        run: bun run tauri:windows:build -- --arch x64,arm64 --runner bun

      - name: Upload MSIX to release assets
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = (Get-Content .version | ForEach-Object { $_.Trim() })
          $TAG = "agent-one-v${VERSION}"
          $MSIX_DIR = "src-tauri/target/msix"
          if (Test-Path $MSIX_DIR) {
            Get-ChildItem -Path $MSIX_DIR -Include *.msix, *.msixbundle -Recurse | ForEach-Object {
              gh release upload "$TAG" $_.FullName --clobber
            }
          }

      - name: Upload .deb artifact for snap build
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-artifact
          path: src-tauri/target/release/bundle/deb/*.deb

  build-snap:
    needs: release-tauri
    if: ${{ !failure() && !cancelled() && !inputs.msix-only }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get version and release tag
        id: get_tag
        run: |
          VERSION=$(head -n1 .version | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=agent-one-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download .deb artifact
        id: artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: deb-artifact

      - name: Fall back to .deb from release
        if: steps.artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "Artifact not found, downloading .deb from release $TAG..."
          DEB_ASSET=$(gh release view "$TAG" --repo ${{ github.repository }} --json assets --jq '.assets[].name' | grep '_amd64\.deb$' | grep -v '\.sig$' | head -n1)
          if [ -z "$DEB_ASSET" ]; then
            echo "ERROR: No amd64 .deb found in release $TAG"
            exit 1
          fi
          gh release download "$TAG" --repo ${{ github.repository }} --pattern "$DEB_ASSET" --dir .

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          mkdir -p snap
          cp distribution/snap/snapcraft.yaml snap/snapcraft.yaml
          sudo snapcraft pack --destructive-mode --verbose

      - name: Upload snap to release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.get_tag.outputs.tag }}" *.snap --clobber
