name: Mirror Release to Public Repo

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Source release tag to mirror (e.g. agent-one-v0.0.0)"
        required: true
        type: string

jobs:
  mirror-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SOURCE_REPO: The-Best-Codes/agent-one
      TARGET_REPO: AgentOne-Dev/agent-one-public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p /tmp/release-assets

          echo "Fetching release info for $TAG..."
          ASSET_COUNT=$(gh release view "$TAG" --repo "$SOURCE_REPO" --json assets --jq '.assets | length')
          echo "Found $ASSET_COUNT asset(s)"

          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "ERROR: No assets found in release $TAG"
            exit 1
          fi

          gh release download "$TAG" --repo "$SOURCE_REPO" --dir /tmp/release-assets --clobber
          echo "Downloaded assets:"
          ls -lh /tmp/release-assets/

      - name: Rewrite latest.json asset URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f /tmp/release-assets/latest.json ]; then
            TAG="${{ steps.tag.outputs.tag }}"
            echo "Rewriting asset URLs in latest.json..."

            gh api "repos/$SOURCE_REPO/releases/tags/$TAG" > /tmp/source-release.json

            jq \
              --arg source_repo "$SOURCE_REPO" \
              --arg target_repo "$TARGET_REPO" \
              --slurpfile release /tmp/source-release.json \
              '($release[0].assets | map({
                key: .url,
                value: (.browser_download_url | sub($source_repo; $target_repo))
              }) | from_entries) as $asset_urls
              | .platforms |= with_entries(
                  .value.url = ($asset_urls[.value.url] // (.value.url | sub($source_repo; $target_repo)))
                )' \
              /tmp/release-assets/latest.json > /tmp/latest.json

            mv /tmp/latest.json /tmp/release-assets/latest.json

            if jq -e --arg target_repo "$TARGET_REPO" '
              [.platforms[].url]
              | all(startswith("https://github.com/" + $target_repo + "/releases/download/"))
            ' /tmp/release-assets/latest.json > /dev/null; then
              echo "All updater URLs point to mirrored release downloads."
            else
              echo "ERROR: latest.json contains an unresolved asset URL"
              exit 1
            fi

            echo "Updated latest.json:"
            cat /tmp/release-assets/latest.json
          else
            echo "No latest.json found, skipping rewrite"
          fi

      - name: Fetch source release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" --repo "$SOURCE_REPO" --json name,body,isPrerelease > /tmp/release-meta.json

          TITLE=$(jq -r '.name // empty' /tmp/release-meta.json)
          IS_PRERELEASE=$(jq -r '.isPrerelease' /tmp/release-meta.json)

          # Store body in a file to handle multi-line content
          jq -r '.body // empty' /tmp/release-meta.json > /tmp/release-notes.md

          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release: $TITLE (prerelease=$IS_PRERELEASE)"

      - name: Create or update target release and upload assets
        env:
          GH_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TITLE="${{ steps.meta.outputs.title }}"
          IS_PRERELEASE="${{ steps.meta.outputs.is_prerelease }}"

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Check if the release already exists on the target
          if gh release view "$TAG" --repo "$TARGET_REPO" --json tagName > /dev/null 2>&1; then
            echo "Target release $TAG exists, updating..."
            gh release edit "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --latest
          else
            echo "Creating target release $TAG..."
            gh release create "$TAG" \
              --repo "$TARGET_REPO" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              --latest \
              $PRERELEASE_FLAG
          fi

          echo "Uploading assets..."
          gh release upload "$TAG" \
            /tmp/release-assets/* \
            --repo "$TARGET_REPO" \
            --clobber

          echo "Successfully mirrored $TAG to $TARGET_REPO"

      - name: Revalidate download page and release cache
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://www.agent-one.dev/api/revalidate" \
            -H "Authorization: Bearer ${{ secrets.REVALIDATION_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"paths":["/download"],"tags":["latest-release"]}')

          if [ "$RESPONSE" = "200" ]; then
            echo "Successfully revalidated website download page."
          else
            echo "Revalidation failed with HTTP $RESPONSE"
            exit 1
          fi
