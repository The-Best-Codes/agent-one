name: "Build MSIX"

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build MSIX
        run: bun run tauri:windows:build -- --arch x64 --runner bun --verbose

      - name: Upload MSIX as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-bundle
          path: src-tauri/target/msix/*.msix*

      - name: Upload MSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = (Get-Content .version | Select-Object -First 1).Trim()
          $TAG = "agent-one-v${VERSION}"
          $MSIX_DIR = "src-tauri/target/msix"
          if (Test-Path $MSIX_DIR) {
            Get-ChildItem -Path $MSIX_DIR -Include *.msix* -Recurse | ForEach-Object {
              gh release upload "$TAG" $_.FullName --clobber
            }
          }

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.4

      - name: Submit to Microsoft Store
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
        shell: pwsh
        run: |
          if (-not $env:PARTNER_CENTER_CLIENT_SECRET -or -not $env:MSSTORE_PRODUCT_ID) {
            Write-Host "Store credentials not configured, skipping submission"
            exit 0
          }
          $MSIX = Get-ChildItem -Path "src-tauri/target/msix" -Filter *_x64.msix -Recurse | Select-Object -First 1
          if (-not $MSIX) { throw "No x64 .msix found" }
          msstore reconfigure --tenantId $env:PARTNER_CENTER_TENANT_ID --sellerId $env:PARTNER_CENTER_SELLER_ID --clientId $env:PARTNER_CENTER_CLIENT_ID --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
          msstore publish $MSIX.FullName --appId $env:MSSTORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed" }
