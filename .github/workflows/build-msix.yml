name: "Build MSIX"

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "src-tauri -> target"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build MSIX
        run: bun run tauri:windows:build -- --arch x64 --runner bun

      - name: Upload MSIX to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $VERSION = (Get-Content .version | ForEach-Object { $_.Trim() })
          $TAG = "agent-one-v${VERSION}"
          $MSIX_DIR = "src-tauri/target/msix"
          if (Test-Path $MSIX_DIR) {
            Get-ChildItem -Path $MSIX_DIR -Include *.msix -Recurse | ForEach-Object {
              gh release upload "$TAG" $_.FullName --clobber
            }
          }
