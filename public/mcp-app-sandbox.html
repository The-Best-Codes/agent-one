<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        background: transparent;
      }

      iframe {
        display: block;
      }
    </style>
  </head>
  <body>
    <script>
      let appFrame;

      function isJsonRpc(value) {
        return value && value.jsonrpc === "2.0";
      }

      function injectCsp(html, csp) {
        if (!csp) return html;
        const meta =
          '<meta http-equiv="Content-Security-Policy" content="' +
          csp.replaceAll('"', "&quot;") +
          '">';
        return html.includes("<head>") ? html.replace("<head>", "<head>" + meta) : meta + html;
      }

      function injectColorSchema(html, theme) {
        if (!theme) return html;
        if (/<html\b[^>]*style\s*=\s*["'][^"'>]*color-scheme/i.test(html)) return html;
        var m = html.match(/(<html\b[^>]*?style\s*=\s*["'])([^"']*)(["'])/i);
        if (m) {
          var existing = m[2].trim();
          var append = existing ? existing + "; " : "";
          return html.replace(m[0], m[1] + append + "color-scheme:" + theme + m[3]);
        }
        return html.replace(/(<html)\b/i, '$1 style="color-scheme:' + theme + '"');
      }

      function getParentTheme() {
        try {
          return window.parent.document.documentElement.classList.contains("dark")
            ? "dark"
            : "light";
        } catch (_) {
          return "light";
        }
      }

      function createAppFrame(params) {
        appFrame?.remove();
        appFrame = document.createElement("iframe");
        appFrame.sandbox = params.sandbox || "allow-scripts allow-forms";
        if (params.allow) {
          appFrame.allow = params.allow;
        }
        let html = params.html;
        html = injectCsp(html, params.csp);
        html = injectColorSchema(html, getParentTheme());
        appFrame.srcdoc = html;
        document.body.appendChild(appFrame);
      }

      window.addEventListener("message", (event) => {
        const data = event.data;

        if (
          isJsonRpc(data) &&
          data.method === "ui/notifications/sandbox-resource-ready" &&
          event.source === window.parent
        ) {
          createAppFrame(data.params || {});
          return;
        }

        if (isJsonRpc(data) && appFrame && event.source === window.parent) {
          appFrame.contentWindow.postMessage(data, "*");
        } else if (isJsonRpc(data) && event.source === appFrame?.contentWindow) {
          window.parent.postMessage(data, "*");
        }
      });

      window.parent.postMessage(
        {
          jsonrpc: "2.0",
          method: "ui/notifications/sandbox-proxy-ready",
        },
        "*",
      );
    </script>
  </body>
</html>
