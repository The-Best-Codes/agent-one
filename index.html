<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="AgentOne is a powerful AI assistant and deep researcher that gives you freedom to choose your models and control your data."
    />
    <link rel="stylesheet" href="src/index.css" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      let theme = "light";
      let themeFromStorage = localStorage.getItem("agent-one-setting-THEME");
      if (!themeFromStorage) {
        localStorage.setItem("agent-one-setting-THEME", "system");
        themeFromStorage = "system";
      }

      if (themeFromStorage && themeFromStorage !== "system") {
        theme = themeFromStorage;
      } else if (themeFromStorage === "system") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
      }

      let roundness = "md";
      let roundnessFromStorage = localStorage.getItem(
        "agent-one-setting-ROUNDNESS",
      );
      if (!roundnessFromStorage) {
        localStorage.setItem("agent-one-setting-ROUNDNESS", "md");
        roundnessFromStorage = "md";
      }

      if (roundnessFromStorage) {
        roundness = roundnessFromStorage;
      }

      document.documentElement.classList.remove("light", "dark");
      document.documentElement.classList.add(theme);
      document.documentElement.setAttribute("data-theme", theme);

      document.documentElement.classList.remove(
        "theme-radius-none",
        "theme-radius-sm",
        "theme-radius-md",
        "theme-radius-lg",
      );
      document.documentElement.classList.add(`theme-radius-${roundness}`);
      document.documentElement.setAttribute("data-roundness", roundness);
    </script>
    <title>AgentOne</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
