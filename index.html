<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="AgentOne is a powerful AI agent that gives you freedom to choose your models and control your data."
    />
    <link rel="stylesheet" href="src/index.css" />
    <link rel="icon" type="image/svg+xml" href="/icon-dark-wide-padding.svg" />
    <script>
      function jsonParseCatch(value) {
        if (!value) return value;
        try {
          return JSON.parse(value);
        } catch {
          return value;
        }
      }

      // Handle theme
      let theme = "light";
      let themeFromStorage = localStorage.getItem("agent-one-setting-THEME");
      if (!themeFromStorage) {
        localStorage.setItem("agent-one-setting-THEME", JSON.stringify("system"));
        themeFromStorage = JSON.stringify("system");
      }

      let parsedTheme = jsonParseCatch(themeFromStorage) || "system";
      if (parsedTheme !== "system") {
        theme = parsedTheme;
      } else {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      document.documentElement.classList.remove("light", "dark");
      document.documentElement.classList.add(theme);
      document.documentElement.setAttribute("data-theme", theme);

      // Handle font
      let fontFromStorage = localStorage.getItem("agent-one-setting-FONT");
      let parsedFont = jsonParseCatch(fontFromStorage) || "default";

      document.documentElement.classList.remove("font-space-grotesk", "font-sans", "font-mono");
      if (parsedFont === "default") {
        document.documentElement.classList.add("font-space-grotesk");
      } else if (parsedFont === "system") {
        document.documentElement.classList.add("font-sans");
      } else if (parsedFont === "mono") {
        document.documentElement.classList.add("font-mono");
      }
      document.documentElement.setAttribute("data-font", parsedFont);
    </script>
    <title>AgentOne</title>
  </head>

  <body>
    <div id="root">
      <main
        class="flex h-screen flex-col items-center justify-center"
        role="main"
        data-testid="main"
      >
        <img src="/icon-dark-raw.svg" alt="AgentOne" class="size-48 select-none dark:invert" />
        <div
          class="animate-in fade-in fill-mode-backwards bg-muted relative mt-6 flex h-1 w-48 items-center overflow-x-hidden rounded-full delay-300"
          role="progressbar"
        >
          <div
            class="bg-primary h-full w-1/4 rounded-full"
            style="animation: progress-indeterminate 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite"
          ></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
